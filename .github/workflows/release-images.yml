name: Release Images

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/shirley0702/plataforma-ciberacoso-backend:${{ github.event.workflow_run.head_sha }}
            ghcr.io/shirley0702/plataforma-ciberacoso-backend:main
      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_ADMIN_URL=/admin/
          tags: |
            ghcr.io/shirley0702/plataforma-ciberacoso-frontend:${{ github.event.workflow_run.head_sha }}
            ghcr.io/shirley0702/plataforma-ciberacoso-frontend:main
