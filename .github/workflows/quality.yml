name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cibersegura_test
          POSTGRES_USER: cibersegura
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cibersegura -d cibersegura_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-2026
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: cibersegura_test
      POSTGRES_USER: cibersegura
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      TEXT_REVIEW_MODEL_PATH: /tmp/text_review_classifier.joblib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -c backend/constraints.txt -r backend/requirements.txt
      - name: Check configuration and migrations
        working-directory: backend
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        working-directory: backend
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run component and accessibility tests
        working-directory: frontend
        run: pnpm test
      - name: Build production frontend
        working-directory: frontend
        run: pnpm build

  end-to-end:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      APP_VERSION: ${{ github.sha }}
      DJANGO_SECRET_KEY: ci-compose-secret-key-with-more-than-fifty-characters
      DEMO_USER_PASSWORD: "Demo-CI-2026-safe!"
      DEMO_ADMIN_PASSWORD: "Admin-CI-2026-safe!"
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      E2E_DEMO_PASSWORD: "Demo-CI-2026-safe!"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install E2E dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated application
        run: docker compose up -d --build
      - name: Wait for healthy frontend
        run: curl --fail --retry 40 --retry-delay 3 --retry-all-errors http://localhost:8080/healthz
      - name: Run complete participant flow
        working-directory: frontend
        run: pnpm test:e2e
      - name: Verify PostgreSQL backup and restore
        run: |
          sh scripts/backup-postgres.sh
          backup_file="$(find backups -maxdepth 1 -name '*.dump' -print -quit)"
          sh scripts/test-postgres-restore.sh "$backup_file"
      - name: Upload E2E evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop isolated application
        if: always()
        run: docker compose down --volumes --remove-orphans
