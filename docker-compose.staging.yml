services:
  db:
    restart: unless-stopped

  backend:
    image: ghcr.io/shirley0702/plataforma-ciberacoso-backend:${APP_VERSION:?Define APP_VERSION}
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:?Define APP_VERSION}
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Define DJANGO_ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_SESSION_COOKIE_SECURE: "True"
      DJANGO_CSRF_COOKIE_SECURE: "True"
      DJANGO_SECURE_HSTS_SECONDS: "31536000"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
      DJANGO_SECURE_HSTS_PRELOAD: "True"

  frontend:
    image: ghcr.io/shirley0702/plataforma-ciberacoso-frontend:${APP_VERSION:?Define APP_VERSION}
    restart: unless-stopped
